<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Liya AI Settings</title>
  <style>
    :root {
      --bg-color: #0f1117;
      --card-bg: #1a1d26;
      --border-color: #2b3040;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --success: #10b981;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 360px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 16px;
      font-size: 13px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
    }

    .title-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-icon {
      width: 24px;
      height: 24px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 14px;
    }

    h1 {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .status-badge {
      font-size: 11px;
      padding: 3px 9px;
      border-radius: 9999px;
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
      font-weight: 600;
      letter-spacing: 0.03em;
    }

    .status-badge.standby {
      background: rgba(156, 163, 175, 0.15);
      color: var(--text-muted);
    }

    .status-badge.paused {
      background: rgba(239, 68, 68, 0.15);
      color: var(--danger);
    }

    .site-hint {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: -8px;
      margin-bottom: 14px;
      padding: 6px 10px;
      background: rgba(255, 255, 255, 0.04);
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .site-hint-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: #6b7280;
    }

    .site-hint-dot.active {
      background-color: var(--success);
      box-shadow: 0 0 6px var(--success);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 16px;
    }

    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 10px;
      border-radius: 8px;
      text-align: center;
    }

    .stat-number {
      font-size: 18px;
      font-weight: 700;
      color: var(--primary);
    }

    .stat-label {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .form-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 12px;
      outline: none;
      transition: border-color 0.15s;
    }

    input:focus {
      border-color: var(--primary);
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 14px 0;
      padding: 10px;
      background: var(--card-bg);
      border-radius: 6px;
      border: 1px solid var(--border-color);
    }

    .toggle-row span {
      font-size: 12px;
      font-weight: 500;
    }

    .toggle-switch {
      position: relative;
      width: 36px;
      height: 20px;
      cursor: pointer;
    }

    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #374151;
      border-radius: 20px;
      transition: 0.2s;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      border-radius: 50%;
      transition: 0.2s;
    }

    input:checked + .slider {
      background-color: var(--primary);
    }

    input:checked + .slider:before {
      transform: translateX(16px);
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }

    button {
      flex: 1;
      padding: 9px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: background-color 0.15s;
    }

    .btn-primary {
      background-color: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
    }

    .btn-secondary {
      background-color: #242938;
      color: var(--text-main);
      border: 1px solid var(--border-color);
    }

    .btn-secondary:hover {
      background-color: #2f364a;
    }

    .toast {
      margin-top: 10px;
      padding: 8px;
      border-radius: 4px;
      font-size: 11px;
      text-align: center;
      display: none;
    }

    .toast.success {
      display: block;
      background: rgba(16, 185, 129, 0.2);
      color: var(--success);
    }

    .toast.error {
      display: block;
      background: rgba(239, 68, 68, 0.2);
      color: var(--danger);
    }
  </style>
</head>
<body>
  <header>
    <div class="title-row">
      <img src="/icons/icon-32.png" alt="Liya AI Icon" style="width: 24px; height: 24px; border-radius: 6px; box-shadow: 0 0 10px rgba(99, 102, 241, 0.4);" />
      <h1>Liya AI</h1>
    </div>
    <span id="engine-status" class="status-badge standby">STANDBY</span>
  </header>

  <div id="site-hint" class="site-hint">
    <span id="site-hint-dot" class="site-hint-dot"></span>
    <span id="site-hint-text">Standby — Open ChatGPT, Claude, or Gemini</span>
  </div>

  <div class="stats-grid">
    <div class="stat-card">
      <div id="stat-turns" class="stat-number">0</div>
      <div id="stat-label-turns" class="stat-label">Captured Turns</div>
    </div>
    <div class="stat-card">
      <div id="stat-sessions" class="stat-number">0</div>
      <div id="stat-label-sessions" class="stat-label">Active Sessions</div>
    </div>
  </div>

  <div class="form-group">
    <label id="label-endpoint" for="endpoint-url">Ingestion Endpoint</label>
    <input id="endpoint-url" type="text" placeholder="http://localhost:3000/api/sessions" />
  </div>

  <div class="form-group">
    <label id="label-auth" for="auth-token">Bearer Auth Token</label>
    <input id="auth-token" type="password" placeholder="liya_sec_..." />
  </div>

  <div class="toggle-row">
    <span id="label-pause-sync">Pause Engine & Sync</span>
    <label class="toggle-switch">
      <input id="sync-pause-toggle" type="checkbox" />
      <span class="slider"></span>
    </label>
  </div>

  <div class="actions">
    <button id="btn-save" class="btn-primary">Save Settings</button>
    <button id="btn-sync-now" class="btn-secondary">Sync Now</button>
  </div>

  <div id="toast" class="toast"></div>

  <script type="module" src="./popup.ts"></script>
</body>
</html>
