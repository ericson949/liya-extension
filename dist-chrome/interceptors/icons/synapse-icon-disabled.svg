<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="bgGradDisabled" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#181920" />
      <stop offset="100%" stop-color="#0c0d12" />
    </radialGradient>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGradDisabled)" stroke="#27272a" stroke-width="2" />

  <!-- Synaptic Network Lines (Muted Grayscale) -->
  <g stroke="#52525b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.6">
    <!-- Outer contour -->
    <line x1="64" y1="24" x2="36" y2="40" />
    <line x1="64" y1="24" x2="92" y2="40" />
    <line x1="36" y1="40" x2="50" y2="56" />
    <line x1="92" y1="40" x2="78" y2="56" />
    
    <!-- Central core cross and bridges -->
    <line x1="50" y1="56" x2="78" y2="56" />
    <line x1="50" y1="56" x2="78" y2="76" />
    <line x1="78" y1="56" x2="50" y2="76" />
    <line x1="50" y1="56" x2="50" y2="76" />
    <line x1="78" y1="56" x2="78" y2="76" />
    <line x1="50" y1="76" x2="78" y2="76" />

    <!-- Bottom tentacles -->
    <line x1="50" y1="76" x2="36" y2="92" />
    <line x1="78" y1="76" x2="92" y2="92" />
    <line x1="36" y1="92" x2="64" y2="104" />
    <line x1="92" y1="92" x2="64" y2="104" />
  </g>

  <!-- Inactive Muted Nodes -->
  <g fill="#71717a">
    <circle cx="64" cy="24" r="4.5" />
    <circle cx="36" cy="40" r="4" />
    <circle cx="92" cy="40" r="4" />
    <circle cx="50" cy="56" r="4.5" />
    <circle cx="78" cy="56" r="4.5" />
    <circle cx="50" cy="76" r="4.5" />
    <circle cx="78" cy="76" r="4.5" />
    <circle cx="36" cy="92" r="4" />
    <circle cx="92" cy="92" r="4" />
    <circle cx="64" cy="104" r="4.5" />
  </g>
</svg>
