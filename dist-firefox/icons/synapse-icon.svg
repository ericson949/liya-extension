<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090a0f" />
    </radialGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)" stroke="#2e3248" stroke-width="2" />

  <!-- Synaptic Network Lines -->
  <g filter="url(#glow)" stroke="url(#neonGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.95">
    <!-- Outer contour -->
    <line x1="64" y1="24" x2="36" y2="40" />
    <line x1="64" y1="24" x2="92" y2="40" />
    <line x1="36" y1="40" x2="50" y2="56" />
    <line x1="92" y1="40" x2="78" y2="56" />
    
    <!-- Central core cross and bridges -->
    <line x1="50" y1="56" x2="78" y2="56" />
    <line x1="50" y1="56" x2="78" y2="76" />
    <line x1="78" y1="56" x2="50" y2="76" />
    <line x1="50" y1="56" x2="50" y2="76" />
    <line x1="78" y1="56" x2="78" y2="76" />
    <line x1="50" y1="76" x2="78" y2="76" />

    <!-- Bottom tentacles -->
    <line x1="50" y1="76" x2="36" y2="92" />
    <line x1="78" y1="76" x2="92" y2="92" />
    <line x1="36" y1="92" x2="64" y2="104" />
    <line x1="92" y1="92" x2="64" y2="104" />
  </g>

  <!-- Glowing Nodes -->
  <g filter="url(#glow)">
    <circle cx="64" cy="24" r="5" fill="#38bdf8" />
    <circle cx="36" cy="40" r="4.5" fill="#c084fc" />
    <circle cx="92" cy="40" r="4.5" fill="#38bdf8" />
    <circle cx="50" cy="56" r="5" fill="#a855f7" />
    <circle cx="78" cy="56" r="5" fill="#38bdf8" />
    <circle cx="50" cy="76" r="5" fill="#a855f7" />
    <circle cx="78" cy="76" r="5" fill="#38bdf8" />
    <circle cx="36" cy="92" r="4.5" fill="#c084fc" />
    <circle cx="92" cy="92" r="4.5" fill="#38bdf8" />
    <circle cx="64" cy="104" r="5" fill="#38bdf8" />
  </g>
</svg>
